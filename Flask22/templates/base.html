<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% block title %} flask wtf form{% endblock %}</title>
</head>
<body>
    <h1>Flask wtf</h1>
    {% with msgs = get_flashed_messages(with_categories = True) %}
    {% if msgs %}
    {% for category, msg in msgs %}
    
    <p style="color: green;"> {{msg}}</p>
    {% endfor %}
    
    {% endif %}
    {% endwith %}
    {% block content %} {% endblock %}
</body>
</html>
